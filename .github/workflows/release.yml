# Baut Windows- und Linux-App, das Docker-Image (ghcr.io) und das Docker-Paket
# und veröffentlicht ein GitHub-Release,
# sobald auf main eine neue Versionsnummer in VERSION steht.
# Steht die Version schon als Release, passiert nichts.
# Fremde Actions sind auf feste Commits gepinnt (Kommentar = Version).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(tr -d '[:space:]' < VERSION)"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION ungültig: '$ver'"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver"    >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release v$ver gibt es schon – nichts zu tun."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Windows-App bauen
        run: |
          npm ci
          npx electron-packager . HermesVI --platform=win32 --arch=x64 --out=dist --overwrite `
            --icon=assets/icon.ico --app-version=${{ needs.version.outputs.version }} `
            --ignore='^/dist' --ignore='^/config.json' --ignore='^/LIESMICH.txt'
          Copy-Item LIESMICH.txt dist/HermesVI-win32-x64/LIESMICH.txt
          Compress-Archive -Path dist/HermesVI-win32-x64 -DestinationPath "../HermesVI-Windows-${{ needs.version.outputs.tag }}.zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: HermesVI-Windows-*.zip
          retention-days: 3

  linux:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Linux-App bauen (AppImage + .deb)
        run: |
          npm ci
          npm pkg set version=${{ needs.version.outputs.version }}
          npx electron-builder --linux AppImage deb --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          retention-days: 3

  docker:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: img
        run: |
          ver='${{ needs.version.outputs.version }}'
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hermesvi"
          {
            echo "tags<<EOF"
            echo "$img:$ver"
            echo "$img:${ver%.*}"
            echo "$img:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Image bauen und veröffentlichen (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.img.outputs.tags }}
          labels: |
            org.opencontainers.image.title=HermesVI
            org.opencontainers.image.description=HermesVI – Sprach-Web-App für den Hermes-Agenten
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: false

  release:
    needs: [version, windows, linux, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Docker-Paket packen
        run: |
          ver='${{ needs.version.outputs.version }}'
          mkdir -p stage && cp -r docker stage/hermesvi
          (cd stage && zip -qr9 "../assets/HermesVI-Docker-v$ver.zip" hermesvi)
      - name: Release-Text aus CHANGELOG.md
        run: |
          ver='${{ needs.version.outputs.version }}'
          awk -v v="## v$ver" 'index($0,v)==1{p=1;print;next} /^## /{if(p)exit} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "HermesVI $ver" > notes.md
          cat >> notes.md <<EOF

          ### Downloads
          - **Windows:** \`HermesVI-Windows-v$ver.zip\` entpacken → \`HermesVI.exe\`
          - **Linux (Ubuntu/Mint):** \`.deb\` per Doppelklick installieren – oder \`.AppImage\` ausführbar machen und starten
          - **Handy/Browser (Docker):** Image \`ghcr.io/itclucke/hermesvi:$ver\` (bzw. \`:latest\`) – Compose-Datei und Vorlagen in \`HermesVI-Docker-v$ver.zip\`. Update: \`docker compose pull && docker compose up -d\`
          - **Prüfsummen:** \`SHA256SUMS.txt\` – Windows: \`Get-FileHash <Datei>\`, Linux: \`sha256sum -c SHA256SUMS.txt --ignore-missing\`
          EOF
      - name: Prüfsummen erzeugen
        run: |
          cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HermesVI ${{ needs.version.outputs.tag }}" --notes-file notes.md
