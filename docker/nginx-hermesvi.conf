# /etc/nginx/sites-available/hermesvi  →  ln -s ../sites-available/hermesvi /etc/nginx/sites-enabled/
# server_name + Zertifikatspfade anpassen (Variante A: mkcert, Variante B: Let's Encrypt per DNS-Challenge)

server {
    listen 443 ssl;
    http2 on;
    server_name hermesvi.deine-domain.de 100.64.0.20;   # Subdomain und/oder NetBird-IP des Docker-Hosts

    ssl_certificate     /etc/nginx/ssl/hermesvi.crt;
    ssl_certificate_key /etc/nginx/ssl/hermesvi.key;

    client_max_body_size 12m;        # Sprachaufnahmen (HermesVI nimmt max. 12 MB an)

    location / {
        proxy_pass http://127.0.0.1:8800;     # nginx im Docker? dann http://hermesvi:8800 (gleiches Docker-Netz)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # wichtig: die Antwort kommt als Stream
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
