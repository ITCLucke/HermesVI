services:
  hermesvi:
    # Fertiges Image aus den GitHub-Releases. Update: docker compose pull && docker compose up -d
    # Feste Version statt latest möglich, z. B. ghcr.io/itclucke/hermesvi:1.2.3
    image: ghcr.io/itclucke/hermesvi:latest
    # Selbst bauen (z. B. für lokale Spracherkennung mit faster-whisper): nächste Zeile einkommentieren,
    # dann: docker compose build --build-arg EXTRA_PIP="faster-whisper edge-tts" && docker compose up -d
    # build: .
    container_name: hermesvi
    restart: unless-stopped
    env_file: hermesvi.env
    environment:
      HOST: 0.0.0.0
      PORT: 8800
    # nur lokal auf dem Docker-Host; nach außen geht es über Caddy
    ports:
      - "127.0.0.1:8800:8800"
    volumes:
      - whisper_models:/models     # Spracherkennungs-Modell bleibt bei Updates erhalten
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 200
    mem_limit: 2g                 # lokales Whisper „medium“ braucht mehr → erhöhen

  caddy:
    image: caddy:2
    container_name: hermesvi-caddy
    restart: unless-stopped
    depends_on: [hermesvi]
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  whisper_models:
  caddy_data:
  caddy_config:
